<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members · GEB Club</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<header class="site"><nav>
  <a class="brand" href="/">GEB Club</a>
  <a href="/history">History</a>
  <a href="/voting">How we vote</a>
  <a href="/members/" aria-current="page">Members</a>
  <a href="/members/me">My page</a>
  <button class="link small" id="logout">Sign out</button>
</nav></header>
<main>
  <h1>Members</h1>

  <section id="account"></section>

  <h2>Elections</h2>
  <div id="elections"><p class="muted">Loading…</p></div>
  <details class="card" id="new-election-box" hidden>
    <summary>New election</summary>
    <form id="new-election">
      <div class="row">
        <div><label for="ne-title">Title</label><input id="ne-title" required style="width:100%"></div>
        <div><label for="ne-method">Voting method</label><select id="ne-method" style="width:100%"></select></div>
        <button>Create</button>
      </div>
      <p class="error small" id="ne-msg" role="alert"></p>
    </form>
  </details>

  <h2>Vote weights</h2>
  <div class="table-wrap" id="standings"><p class="muted">Loading…</p></div>

  <h2>History</h2>
  <div class="table-wrap" id="history"><p class="muted">Loading…</p></div>

  <h2>Accounts</h2>
  <div class="table-wrap" id="members"><p class="muted">Loading…</p></div>
</main>
<script type="module">
import { api, el, fmt, pill, logout, getMe, thumb } from './app.js';

document.getElementById('logout').onclick = logout;
let me = null;

// ---------------------------------------------------------------- account
function errorLine() { return el('p.error.small', { role: 'alert' }); }

function onSubmit(form, fn, msg) {
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    try { await fn(); } catch (err) { msg.textContent = err.message; }
  });
  return form;
}

async function renderAccount() {
  const box = document.getElementById('account');
  if (me) {
    box.replaceChildren(
      el('p', 'Signed in as ', el('strong', me.name), ' · ',
        el('a', { href: '/members/me' }, 'My page'), ' · ',
        el('button.link', { type: 'button', onclick: async () => {
          await api('/api/accounts/logout', { method: 'POST' });
          me = null; renderAccount(); refreshActions();
        } }, 'Switch account')));
    return;
  }

  const members = await api('/api/members');
  const inMsg = errorLine(), upMsg = errorLine();
  const who = el('select', { id: 'si-who', required: true, style: 'width:100%' },
    el('option', { value: '' }, ''), members.map((m) => el('option', { value: m.id }, m.name)));
  const inPw = el('input', { type: 'password', id: 'si-pw', autocomplete: 'current-password', style: 'width:100%' });
  const upFirst = el('input', { id: 'su-first', maxLength: 40, autocomplete: 'given-name', style: 'width:100%' });
  const upDiscord = el('input', { id: 'su-discord', maxLength: 40, autocomplete: 'username', style: 'width:100%' });
  const upPw = el('input', { type: 'password', id: 'su-pw', autocomplete: 'new-password', style: 'width:100%' });

  const signedIn = (r) => { me = r.me; renderAccount(); refreshActions(); loadMembers(); loadStandings(); };
  box.replaceChildren(
    members.length ? el('div.card', el('h3', 'Sign in'), onSubmit(el('form',
      el('div.row',
        el('div', el('label', { htmlFor: 'si-who' }, 'Name'), who),
        el('div', el('label', { htmlFor: 'si-pw' }, 'Password (if set)'), inPw),
        el('button', 'Sign in')),
      inMsg), async () => signedIn(await api('/api/accounts/login', { method: 'POST', body: { member_id: Number(who.value), password: inPw.value } })), inMsg)) : '',
    el('div.card', el('h3', 'Create an account'), onSubmit(el('form',
      el('div.row',
        el('div', el('label', { htmlFor: 'su-first' }, 'First name'), upFirst),
        el('div', el('label', { htmlFor: 'su-discord' }, 'Discord handle'), upDiscord)),
      el('div.row',
        el('div', el('label', { htmlFor: 'su-pw' }, 'Password (optional)'), upPw),
        el('button', 'Create')),
      el('p.muted.small', 'First name or Discord handle required.'),
      upMsg), async () => signedIn(await api('/api/accounts', { method: 'POST', body: { first_name: upFirst.value, discord: upDiscord.value, password: upPw.value } })), upMsg)));
}

function refreshActions() {
  document.getElementById('new-election-box').hidden = !me;
}

// ---------------------------------------------------------------- data
async function loadElections() {
  const { elections, methods } = await api('/api/elections');
  const sel = document.getElementById('ne-method');
  if (!sel.options.length) sel.append(...Object.entries(methods).map(([k, v]) => el('option', { value: k }, v)));
  const box = document.getElementById('elections');
  if (!elections.length) { box.replaceChildren(el('p.muted', 'None')); return; }
  box.replaceChildren(...elections.map((e) => el('div.card',
    el('div', el('a', { href: `/members/election?id=${e.id}` }, el('strong', e.title)), ' ', pill(e.status)),
    el('div.muted.small',
      e.status === 'closed' ? `Winner: ${e.winner ?? '—'} · ${e.n_ballots} ballots · ${methods[e.method] ?? e.method}`
        : `${e.n_candidates} books · ${e.n_ballots} ballots · ${methods[e.method] ?? e.method}`))));
}

async function loadStandings() {
  const { members } = await api('/api/standings');
  const box = document.getElementById('standings');
  if (!members.length) { box.replaceChildren(el('p.muted', 'None')); return; }
  box.replaceChildren(el('table',
    el('tr', el('th', 'Member'), el('th.num', 'Debt'), el('th.num', 'Elections voted'), el('th.num', 'Attendance'), el('th.num', 'Weight')),
    [...members].sort((a, b) => b.weight - a.weight).map((m) => el('tr',
      el('td', m.name), el('td.num', m.newcomer ? el('span.muted', `new (${fmt(m.debt)})`) : fmt(m.debt)),
      el('td.num', fmt(m.roundsSeen, 1)), el('td.num', fmt(m.attendance)), el('td.num', el('strong', fmt(m.weight)))))));
}

async function loadHistory() {
  const books = await api('/api/books');
  document.getElementById('history').replaceChildren(el('table',
    el('tr', el('th.num', '#'), el('th', ''), el('th', 'Book'), el('th', 'Nominated by'), el('th', 'When'), el('th', 'Notes'), el('th.num', 'Member notes')),
    books.map((b) => el('tr',
      el('td.num', b.position),
      el('td', thumb(b.cover_url)),
      el('td', el('a', { href: `/members/book?id=${b.id}` }, el('cite', b.title)), el('div.muted.small', b.author ?? '')),
      el('td', b.nominator === 'none' ? el('span.muted', '—') : b.nominator ?? ''),
      el('td.small', { style: 'white-space:nowrap' }, b.read_date ?? ''),
      el('td.small', b.notes ?? '', b.election_id ? [' ', el('a', { href: `/members/election?id=${b.election_id}` }, 'results')] : ''),
      el('td.num', b.n_notes ? el('a', { href: `/members/book?id=${b.id}` }, b.n_notes) : '')))));
}

async function loadMembers() {
  const members = await api('/api/members');
  const box = document.getElementById('members');
  if (!members.length) { box.replaceChildren(el('p.muted', 'None')); return; }
  box.replaceChildren(el('table',
    el('tr', el('th', 'First name'), el('th', 'Discord'), el('th', 'Profiles'), el('th', 'Favourite'), el('th', 'Joined')),
    members.map((m) => el('tr',
      el('td', m.first_name ? el('a', { href: `/members/member?id=${m.id}` }, m.first_name) : '', me?.id === m.id ? el('span.muted.small', ' (you)') : ''),
      el('td', m.discord ? (m.first_name ? `@${m.discord}` : el('a', { href: `/members/member?id=${m.id}` }, `@${m.discord}`)) : ''),
      el('td.small.links',
        m.storygraph_url && el('a', { href: m.storygraph_url, target: '_blank', rel: 'noopener' }, 'StoryGraph'),
        m.goodreads_url && el('a', { href: m.goodreads_url, target: '_blank', rel: 'noopener' }, 'Goodreads')),
      el('td.small', m.favorite_book_id ? el('a', { href: `/members/book?id=${m.favorite_book_id}` }, el('cite', m.favorite_title)) : ''),
      el('td.small', (m.created_at ?? '').slice(0, 10))))));
}

document.getElementById('new-election').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const { id } = await api('/api/elections', { method: 'POST', body: {
      title: document.getElementById('ne-title').value, method: document.getElementById('ne-method').value } });
    location.href = `/members/election?id=${id}`;
  } catch (err) { document.getElementById('ne-msg').textContent = err.message; }
});

me = await getMe();
renderAccount(); refreshActions();
loadElections(); loadStandings(); loadHistory(); loadMembers();
</script>
</body>
</html>
