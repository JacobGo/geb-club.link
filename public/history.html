<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History · GEB Club</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<header class="site"><nav>
  <a class="brand" href="/">GEB Club</a>
  <a href="/history" aria-current="page">History</a>
  <a href="/voting">How we vote</a>
  <a href="/members/">Members</a>
</nav></header>
<main>
  <h1>History</h1>
  <ol class="books" id="books"><li class="muted">Loading…</li></ol>
</main>
<script>
const make = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
fetch('/api/public/books').then(r => r.json()).then(books => {
  document.getElementById('books').replaceChildren(...books.map(b => make('li', {},
    make('span', { className: 'pos' }, String(b.position)),
    b.cover_url ? make('img', { className: 'thumb', src: b.cover_url, alt: '', loading: 'lazy' }) : make('span', { className: 'thumb thumb-none' }),
    make('span', {},
      make('cite', {}, b.title),
      make('span', { className: 'author' }, b.author ? ` · ${b.author}` : ''), ' ',
      make('a', { className: 'small', target: '_blank', rel: 'noopener',
        href: b.storygraph_url || `https://app.thestorygraph.com/browse?search_term=${encodeURIComponent([b.title, b.author].filter(Boolean).join(' '))}` }, 'StoryGraph')))));
});
</script>
</body>
</html>
