<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEB Club</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
<style>
  .home { max-width: 1100px; text-align: center; overflow: hidden; padding-top: 2.5rem; }

  /* GEB -> Gödel Escher Bach */
  .geb { font-size: clamp(3.2rem, 11vw, 7.5rem); font-weight: 600; letter-spacing: .02em; margin: 0; line-height: 1;
    display: inline-flex; gap: .12em; cursor: default; user-select: none; }
  .geb .w { display: inline-flex; align-items: baseline; }
  .geb { flex-wrap: wrap; justify-content: center; }
  .geb .rest { display: inline-block; max-width: 0; overflow: hidden; opacity: 0; font-size: calc(.42em * var(--rest-scale, 1)); font-style: italic;
    font-weight: 400; color: var(--muted); transition: max-width .7s ease, opacity .5s ease; white-space: nowrap; }
  .geb:hover .rest, .geb:focus .rest, .geb.open .rest { max-width: 16em; opacity: 1; }
  .geb .w:nth-child(2) .rest { transition-delay: .08s; }
  .geb .w:nth-child(3) .rest { transition-delay: .16s; }
  .geb:focus { outline: none; }
  .geb .w.changed { animation: rotate-in .55s cubic-bezier(.2,.7,.2,1); }
  @keyframes rotate-in { from { opacity: 0; transform: translateY(.35em) rotateX(70deg); } to { opacity: 1; transform: none; } }
  .names { display: inline-flex; align-items: center; gap: .9rem; margin-top: .6rem; }
  .names button { background: none; border: 0; color: var(--muted); font-size: 1.1rem; padding: 0 .3rem; cursor: pointer; }
  .names button:hover { color: var(--accent); }
  .names button[hidden] { display: none; }
  .era { display: block; font-size: .75rem; color: var(--muted); min-height: 1.1em; margin-top: .25rem; font-style: italic; }
  .club { display: inline-block; font-size: .95rem; letter-spacing: .5em; text-transform: uppercase; color: var(--muted); padding-left: .5em; }

  /* the strange loop: every book on a turning ring */
  .stage { --w: 104px; --h: 156px; --r: 380px; height: calc(var(--h) * 2.3); perspective: 1400px; perspective-origin: 50% 30%;
    position: relative; margin-top: 1.5rem; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
  .stage.dragging { cursor: grabbing; }
  .floor { position: absolute; left: 50%; top: 62%; width: calc(var(--r) * 2.3); height: calc(var(--r) * .5);
    transform: translate(-50%, 0); background: radial-gradient(ellipse at center, rgba(0,0,0,.18), transparent 65%); pointer-events: none; }
  .ring { position: absolute; left: 50%; top: 18%; width: var(--w); height: var(--h); margin-left: calc(var(--w) / -2);
    transform-style: preserve-3d; transform: rotateX(-9deg) rotateY(0deg); will-change: transform; }
  .ring-book { position: absolute; inset: 0; transform-style: preserve-3d; display: block; }
  /* each cover keeps its own proportions, standing on the bottom of its slot (no cropping) */
  .ring-book .face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .ring-book .face img { display: block; max-width: 100%; max-height: 100%; border-radius: 3px; box-shadow: 0 10px 22px -10px rgba(0,0,0,.55); }
  .ring-book .face img.crop { width: 100%; height: 100%; object-fit: cover; }  /* scans with extra margin, trimmed to 2:3 */
  .ring-book .face.back { transform: rotateY(180deg); filter: brightness(.45) saturate(.7); }
  .ring-book .face.front { transition: transform .25s ease; }
  .ring-book:hover .face.front, .ring-book:focus-visible .face.front { transform: translateZ(18px) scale(1.05); }
  .ring-book:focus-visible { outline: none; }
  .ring-book:focus-visible .face.front img { outline: 2px solid var(--accent); outline-offset: 3px; }
  .ring-book .blank { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: .5rem; font-size: .75rem; font-style: italic; color: var(--muted); background: var(--rule); border-radius: 3px; }

  .count { color: var(--muted); font-size: .95rem; margin-top: .5rem; }
  .count a { color: inherit; }

  @media (max-width: 640px) { .geb { flex-wrap: nowrap; } }
  @media (max-width: 640px) { .stage { --w: 70px; --h: 105px; --r: 250px; } .club { letter-spacing: .35em; } }
  @media (prefers-reduced-motion: reduce) { .geb .rest { transition: none; } }
</style>
</head>
<body>
<header class="site"><nav>
  <a class="brand" href="/">GEB Club</a>
  <a href="/history">History</a>
  <a href="/voting">How we vote</a>
  <a href="/members/">Members</a>
</nav></header>
<main class="home">
  <h1 class="geb open" id="geb" aria-live="polite"></h1>
  <div><span class="names">
    <button type="button" id="older" aria-label="Previous book">‹</button>
    <span class="club" id="club"></span>
    <button type="button" id="newer" aria-label="Next book">›</button>
  </span></div>
  <span class="era" id="era"></span>
  <div class="stage" id="stage" aria-label="Books we've read">
    <div class="floor"></div>
    <div class="ring" id="ring"></div>
  </div>
  <p class="count" id="count"></p>
</main>
<script>
const make = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
// Club names, newest first. One word of G-E-B changes each book.
// chunks: the G, E and B words (first letter shown large). tail: what follows.
// book: the history position (#) the name belonged to, shown as "during <title>". "…" = word not remembered.
// Book 5 (Hunt, Gather, Parent): probably "baby".
const NAMES = [
  { chunks: ['greatandsecretknowledge-', 'esk-', 'bacalao'], tail: 'club', book: 22 },
  { chunks: ['grief ', 'esk ', 'bacalao'], tail: 'club', book: 21 },
  { chunks: ['grief ', 'esk ', 'back2thefuture'], tail: 'club', book: 20 },
  { chunks: ['grief ', 'electronics ', 'back2thefuture'], tail: 'club', book: 19 },
  { chunks: ['galaxy ', 'electronics ', 'back2thefuture'], tail: 'club', book: 18 },
  { chunks: ['galaxy ', 'electronics ', 'byzantine'], tail: 'club', book: 17 },
  { chunks: ['galaxy ', 'ekumenical ', 'byzantine'], tail: 'club', book: 16 },
  { chunks: ['gospel ', 'ekumenical ', 'byzantine'], tail: 'club', book: 15 },
  { chunks: ['gospel ', 'erogenous ', 'byzantine'], tail: 'club', book: 14 },
  { chunks: ['garlic ', 'erogenous ', 'byzantine'], tail: 'club', book: 13 },
  { chunks: ['garlic ', 'erogenous ', 'bromance'], tail: 'club', book: 12 },
  { chunks: ['garlic ', 'enlightenment ', 'bromance'], tail: 'club', book: 11 },
  { chunks: ['ghostwriter ', 'enlightenment ', 'bromance'], tail: 'club', book: 10 },
  { chunks: ['ghostwriter ', 'enlightenment ', 'business'], tail: 'club', book: 9 },
  { chunks: ['ghostwriter ', 'espionage ', 'business'], tail: 'club', book: 8 },
  { chunks: ['guardship ', 'espionage ', 'business'], tail: 'club', book: 7 },
  { chunks: ['guardship ', 'espionage ', 'baby'], tail: 'club', book: 6 },
  { chunks: ['gathering ', 'espionage ', 'baby'], tail: 'club', book: 5 },
  { chunks: ['gathering ', 'espionage ', 'baru'], tail: 'club', book: 4 },
  { chunks: ['gathering ', 'escher ', 'baru'], tail: 'club', book: 3 },
  { chunks: ['gödel ', 'escher ', 'baru'], tail: 'club', book: 2 },
  { chunks: ['gödel ', 'escher ', 'bach'], tail: 'club', book: 1 },
];
let BOOKS = [];
const geb = document.getElementById('geb');
const word = (c) => c.replace(/[-\s]+$/, '');
const nameFor = (position) => NAMES.find((n) => n.book === position);
let shown = null;

// Show one club name; only the word that rotated since the last one animates.
let shownBook = null;
function showName(n, book) {
  if (!n) return;
  if (book !== shownBook) { shownBook = book; document.getElementById('era').replaceChildren(book ? make('span', {}, 'during ', make('cite', {}, book.title)) : ''); }
  if (n === shown) return;
  const prev = shown; shown = n;
  geb.replaceChildren(...n.chunks.map((c, k) => make('span', { className: prev && word(prev.chunks[k]) !== word(c) ? 'w changed' : 'w' },
    c[0].toUpperCase(), make('span', { className: 'rest' }, c.slice(1)))));
  geb.setAttribute('aria-label', `${n.chunks.join('')} ${n.tail}`);
  document.getElementById('club').textContent = n.tail;
  fitName();
}

// Phones: keep the name on one line by shrinking the lowercase parts to fit.
// If they would drop below 55%, shrink the whole title instead.
const phone = matchMedia('(max-width: 640px)');
function fitName() {
  geb.style.removeProperty('--rest-scale');
  geb.style.removeProperty('font-size');
  if (!phone.matches) return;
  const box = geb.parentElement, cs = getComputedStyle(box);
  const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const restW = [...geb.querySelectorAll('.rest')].reduce((t, r) => t + r.scrollWidth, 0);
  const total = geb.scrollWidth;
  if (total <= avail || !restW) return;
  const fixed = total - restW;  // capitals and gaps
  let scale = Math.max(0.55, (avail - fixed) / restW);
  geb.style.setProperty('--rest-scale', scale.toFixed(3));
  // italic text doesn't shrink exactly in proportion; nudge down until it really fits
  for (let k = 0; k < 12 && geb.scrollWidth > avail && scale > 0.55; k++) {
    scale = Math.max(0.55, scale * 0.97);
    geb.style.setProperty('--rest-scale', scale.toFixed(3));
  }
  if (geb.scrollWidth > avail) {
    geb.style.fontSize = `${parseFloat(getComputedStyle(geb).fontSize) * avail / geb.scrollWidth}px`;
  }
}
addEventListener('resize', fitName);
showName(NAMES[0]);

// The ring turns slowly on its own; drag or swipe to spin it (with momentum).
// The book at the front decides the club name shown above. A real mouse hovering
// pauses it; tapping a cover opens it unless you were dragging.
function spinRing(stage, ring, count, onFront) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const AUTO = reduce ? 0 : 4;           // degrees per second (positive = back in time)
  const DRAG = 0.35;                      // degrees per pixel dragged
  const STEP = 360 / count;
  let angle = -(count - 1) * STEP;        // start with the latest book at the front
  // linger on the latest book for a few seconds after the page loads
  let vel = 0, hovering = false, drag = null, target = null, holdUntil = performance.now() + 3000, front = -1, last = performance.now();
  const frontIndex = () => ((Math.round(-angle / STEP) % count) + count) % count;
  const tick = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (target != null) {
      angle += (target - angle) * Math.min(1, dt / 0.18);
      if (Math.abs(target - angle) < 0.05) { angle = target; target = null; vel = 0; }
      if (target != null) holdUntil = Math.max(holdUntil, now + 50);
    } else if (!drag) {
      const idle = hovering || now < holdUntil ? 0 : AUTO;
      vel += (idle - vel) * Math.min(1, dt / 0.45);  // momentum fades back to the idle speed
      angle += vel * dt;
    }
    ring.style.transform = `rotateX(-9deg) rotateY(${angle}deg)`;
    const f = frontIndex();
    if (f !== front) {
      front = f; onFront(f);
      // every time the drift reaches the latest book, settle on it for a few seconds
      if (f === count - 1 && !drag && target == null && Math.abs(vel) <= Math.abs(AUTO) + 0.5 && AUTO) {
        target = -Math.round(-angle / STEP) * STEP; holdUntil = now + 3000 + 400;
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  stage.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') hovering = true; });
  stage.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hovering = false; });
  stage.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, lastX: e.clientX, lastT: e.timeStamp, moved: false, v: 0 };
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.lastX;
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.x) < 6) return;
      if (Math.abs(e.clientY - drag.y) > Math.abs(e.clientX - drag.x)) { drag = null; return; } // vertical: let the page scroll
      drag.moved = true; target = null; stage.classList.add('dragging'); try { stage.setPointerCapture(e.pointerId); } catch {}
    }
    angle += dx * DRAG;
    const dt = Math.max(8, e.timeStamp - drag.lastT) / 1000;
    drag.v = 0.7 * drag.v + 0.3 * (dx * DRAG / dt);
    drag.lastX = e.clientX; drag.lastT = e.timeStamp;
  });
  const end = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.moved) {
      vel = Math.max(-220, Math.min(220, drag.v));  // a hard flick coasts at most ~100 degrees
      // swallow the click that follows a drag so it does not open a cover
      const swallow = (c) => { c.preventDefault(); c.stopPropagation(); };
      stage.addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => stage.removeEventListener('click', swallow, { capture: true }), 80);
      setTimeout(() => stage.classList.remove('dragging'), 0);
    }
    drag = null;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', (e) => { if (drag && e.pointerId === drag.id) drag = null; stage.classList.remove('dragging'); });
  ring.addEventListener('dragstart', (e) => e.preventDefault());

  // Turn to the next/previous book and stay there a few seconds.
  return {
    step(d) {
      const base = target != null ? target : -Math.round(-angle / STEP) * STEP;
      target = base - d * STEP;
      holdUntil = performance.now() + 5000;
    },
  };
}

fetch('/api/public/books').then(r => r.json()).then(books => {
  BOOKS = books;
  const stage = document.getElementById('stage'), ring = document.getElementById('ring');
  const n = books.length;
  // radius so neighbouring covers just clear each other
  const place = () => {
    const w = parseFloat(getComputedStyle(stage).getPropertyValue('--w'));
    const r = Math.max(w * 1.15 / 2 / Math.tan(Math.PI / n), w * 2);
    stage.style.setProperty('--r', `${r}px`);
    [...ring.children].forEach((c, i) => { c.style.transform = `rotateY(${(360 / n) * i}deg) translateZ(${r}px)`; });
  };
  const face = (b, cls) => make('span', { className: `face ${cls}` },
    b.cover_url ? make('img', { src: b.cover_url, alt: '', loading: 'eager', draggable: false, className: b.cover_url.endsWith('#crop') ? 'crop' : '' }) : make('span', { className: 'blank' }, b.title));
  ring.replaceChildren(...books.map(b => make('a', {
    className: 'ring-book', href: b.storygraph_url || '/history', target: '_blank', rel: 'noopener',
    title: `${b.title}${b.author ? ' · ' + b.author : ''}`, ariaLabel: b.title,
  }, face(b, 'front'), face(b, 'back'))));
  place();
  addEventListener('resize', place);

  const spin = spinRing(stage, ring, n, (i) => showName(nameFor(books[i].position), books[i]));
  document.getElementById('older').onclick = () => spin.step(-1);
  document.getElementById('newer').onclick = () => spin.step(1);
  // scroll wheel / swipe on the title also turn the ring, one book at a time
  let wheelLock = 0;
  geb.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) < 4) return;
    e.preventDefault();
    if (Date.now() - wheelLock < 350) return;
    wheelLock = Date.now(); spin.step(e.deltaY > 0 ? -1 : 1);
  }, { passive: false });
  let touchX = null;
  geb.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  geb.addEventListener('touchend', (e) => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 40) spin.step(dx < 0 ? 1 : -1);
  });

  const latest = books.at(-1);
  document.getElementById('count').append(
    make('a', { href: '/history' }, `${n} books`), ' · latest: ',
    make('a', { href: latest?.storygraph_url || '/history', target: '_blank', rel: 'noopener' }, make('cite', {}, latest?.title ?? '')));
});
</script>
</body>
</html>
